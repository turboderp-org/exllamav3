[build-system]
requires = ["setuptools>=77", "wheel", "ninja"]
build-backend = "setuptools.build_meta"

[project]
name = "exllamav3"
description = "Inference library for running local LLMs on modern consumer GPUs"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10.11"
license = "MIT"
authors = [{ name = "turboderp" }]
keywords = ["llm", "inference", "gpu", "quantization", "llama"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.6.0",
    "tokenizers>=0.21.1",
    "numpy>=2.1.0",
    "rich",
    "typing_extensions",
    "safetensors>=0.3.2",
    "ninja",
    "pillow",
    "pyyaml",
    "marisa_trie",
    "pydantic",
    "llguidance>=1.7.0",
    "flash-linear-attention>=0.5.0",
    "triton-windows; platform_system == 'Windows'",
]

[project.optional-dependencies]
rocm = [
    # Full ROCm/HIP stack from AMD's TheRock multi-arch wheel index. No system
    # ROCm install is required: runtime, libraries, compiler and device kernels
    # all live in the venv. The explicit index only applies to direct
    # dependencies, so every package that exists solely on the AMD index must
    # be listed here and mapped in [tool.uv.sources] below.
    "torch[device-gfx1100]>=2.6.0",
    "triton",
    "rocm[libraries,devel,device-gfx1100]>=7.14",
    "rocm-bootstrap",
    "rocm-sdk-core>=7.14",
    "rocm-sdk-libraries>=7.14",
    "rocm-sdk-devel>=7.14",
    "rocm-sdk-device-gfx1100>=7.14",
    "amd-torch-device-gfx1100",
    "amd-torch-device-gfx11",
]
eval = [
    "transformers>=4.50.0",
    "datasets",
    "gguf>=0.14.0",
    "llama-cpp-python",
    "human_eval==1.0.3",
    "matplotlib>=3.10.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "seaborn>=0.13.2",
    "tabulate",
]
examples = [
    "blessed",
    "prompt_toolkit",
    "pyperclip",
    "requests",
    "pydantic",
]
cu124 = [
    "torch>=2.6.0",
]
cu126 = [
    "torch>=2.6.0",
]
cu128 = [
    "torch>=2.6.0",
]
cu129 = [
    "torch>=2.6.0",
]
cu130 = [
    "torch>=2.6.0",
]
cu132 = [
    "torch>=2.6.0",
]

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
include = ["exllamav3*"]

[tool.setuptools.package-data]
exllamav3 = [
    "py.typed",
    "util/hadamard_data/*",
    "conversion/standard_cal_data/*.utf8",
    "exllamav3_ext/**/*",
]

[tool.setuptools.dynamic]
version = { attr = "exllamav3.version.__version__" }

[tool.uv]
package = true
conflicts = [
    [
        { extra = "cu124" },
        { extra = "cu126" },
        { extra = "cu128" },
        { extra = "cu129" },
        { extra = "cu130" },
        { extra = "cu132" },
        { extra = "rocm" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", extra = "cu124" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
    { index = "pytorch-cu129", extra = "cu129" },
    { index = "pytorch-cu130", extra = "cu130" },
    { index = "pytorch-cu132", extra = "cu132" },
    { index = "amd-rocm", extra = "rocm" },
]
triton = [
    { index = "amd-rocm", extra = "rocm" },
]
rocm = [
    { index = "amd-rocm", extra = "rocm" },
]
rocm-bootstrap = [
    { index = "amd-rocm", extra = "rocm" },
]
rocm-sdk-core = [
    { index = "amd-rocm", extra = "rocm" },
]
rocm-sdk-libraries = [
    { index = "amd-rocm", extra = "rocm" },
]
rocm-sdk-devel = [
    { index = "amd-rocm", extra = "rocm" },
]
rocm-sdk-device-gfx1100 = [
    { index = "amd-rocm", extra = "rocm" },
]
amd-torch-device-gfx1100 = [
    { index = "amd-rocm", extra = "rocm" },
]
amd-torch-device-gfx11 = [
    { index = "amd-rocm", extra = "rocm" },
]

[[tool.uv.index]]
name = "amd-rocm"
url = "https://repo.amd.com/rocm/whl-multi-arch/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
